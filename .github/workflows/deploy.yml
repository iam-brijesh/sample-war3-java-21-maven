name: MS-3 CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER_NAME: hello-world-eks
  ECR_REPOSITORY: ms-3
  NAMESPACE: dev

jobs:

  # ============================================================
  # 1. BUILD + TEST + DOCKER IMAGE + PUSH TO ECR
  # ============================================================
  build:
    name: Build and Push MS-3
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.image.outputs.image_tag }}

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: |
          mvn clean package

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::453168420398:role/GitHubActionsRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: image
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
        run: |
          docker build \
            -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            .

      - name: Push Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
        run: |
          docker push \
            $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Show image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
        run: |
          echo "Image pushed:"
          echo "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"


  # ============================================================
  # 2. DEPLOY TO EKS DEV NAMESPACE
  # ============================================================
  deploy:
    name: Deploy MS-3 to DEV
    runs-on: ubuntu-latest

    needs:
      - build

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::453168420398:role/GitHubActionsRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER_NAME

      - name: Verify EKS cluster
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Create dev namespace
        run: |
          kubectl create namespace $NAMESPACE \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Get ECR registry
        id: ecr
        run: |
          REGISTRY=$(aws sts get-caller-identity \
            --query Account \
            --output text).dkr.ecr.${AWS_REGION}.amazonaws.com

          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"

      - name: Deploy MS-3
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          kubectl -n $NAMESPACE create deployment ms-3 \
            --image=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Scale MS-3
        run: |
          kubectl -n $NAMESPACE scale deployment ms-3 --replicas=2

      - name: Create MS-3 service
        run: |
          kubectl -n $NAMESPACE expose deployment ms-3 \
            --name=ms-3 \
            --port=8080 \
            --target-port=8080 \
            --type=ClusterIP \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Wait for deployment
        run: |
          kubectl -n $NAMESPACE rollout status \
            deployment/ms-3 \
            --timeout=300s

      - name: Verify MS-3
        run: |
          echo "======================================"
          echo "MS-3 Deployment"
          echo "======================================"

          kubectl -n $NAMESPACE get deployment ms-3

          echo ""
          echo "======================================"
          echo "MS-3 Pods"
          echo "======================================"

          kubectl -n $NAMESPACE get pods \
            -l app=ms-3

          echo ""
          echo "======================================"
          echo "MS-3 Service"
          echo "======================================"

          kubectl -n $NAMESPACE get service ms-3
