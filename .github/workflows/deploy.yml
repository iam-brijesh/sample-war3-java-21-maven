name: MS-3 CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER_NAME: hello-world-eks
  ECR_REPOSITORY: ms-3
  NAMESPACE: dev

jobs:

  # ============================================================
  # 1. BUILD + TEST + DOCKER IMAGE + PUSH TO ECR
  # ============================================================
  build:
    name: Build and Push MS-3
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.image.outputs.image_tag }}

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: |
          mvn clean package

      # ========================================================
      # OIDC DEBUG
      # ========================================================
      - name: Debug GitHub OIDC claims
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Branch: $GITHUB_REF_NAME"

          RESPONSE=$(curl -sSf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$RESPONSE" | python3 -c \
            'import sys,json; print(json.load(sys.stdin)["value"])')

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2)

          python3 - "$PAYLOAD" <<'PY'
          import sys
          import json
          import base64

          payload = sys.argv[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload).decode()
          )

          print("========================================")
          print("GitHub OIDC claims")
          print("========================================")
          print("iss =", claims.get("iss"))
          print("aud =", claims.get("aud"))
          print("sub =", claims.get("sub"))
          print("repository =", claims.get("repository"))
          print("ref =", claims.get("ref"))
          print("repository_owner =", claims.get("repository_owner"))
          print("========================================")
          PY

      # ========================================================
      # AWS OIDC AUTHENTICATION
      # ========================================================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::453168420398:role/GitHubActionsRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # ========================================================
      # ECR
      # ========================================================
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Verify ECR repository
        run: |
          aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION"

      - name: Set image tag
        id: image
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
        run: |
          docker build \
            -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            .

      - name: Push Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
        run: |
          docker push \
            "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Show image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
        run: |
          echo "Image pushed:"
          echo "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"


  # ============================================================
  # 2. DEPLOY TO EKS DEV
  # ============================================================
  deploy:
    name: Deploy MS-3 to DEV
    runs-on: ubuntu-latest

    needs:
      - build

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      # ========================================================
      # AWS OIDC AUTHENTICATION
      # ========================================================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::453168420398:role/GitHubActionsRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # ========================================================
      # KUBECTL
      # ========================================================
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      - name: Verify EKS cluster
        run: |
          kubectl cluster-info
          kubectl get nodes

      # ========================================================
      # NAMESPACE
      # ========================================================
      - name: Create dev namespace
        run: |
          kubectl create namespace "$NAMESPACE" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      # ========================================================
      # ECR REGISTRY
      # ========================================================
      - name: Get ECR registry
        id: ecr
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          echo "registry=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com" \
            >> "$GITHUB_OUTPUT"

      # ========================================================
      # HELM DEPLOYMENT
      # ========================================================
      - name: Deploy MS-3 with Helm
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          helm upgrade --install ms3 helm/ms3 \
            --namespace "$NAMESPACE" \
            --create-namespace \
            -f helm/ms3/values.yaml \
            -f helm/ms3/values-dev.yaml \
            --set image.repository="$REGISTRY/$ECR_REPOSITORY" \
            --set image.tag="$IMAGE_TAG" \
            --wait \
            --timeout 10m

      # ========================================================
      # VERIFY DEPLOYMENT
      # ========================================================
      - name: Verify deployment
        run: |
          kubectl get deployment -n "$NAMESPACE"
          kubectl get pods -n "$NAMESPACE" \
            -l app.kubernetes.io/name=ms3
          kubectl get service -n "$NAMESPACE"
          kubectl get ingress -n "$NAMESPACE"

      - name: Deployment status
        run: |
          kubectl rollout status \
            deployment/ms3-ms3 \
            -n "$NAMESPACE" \
            --timeout=5m

          echo "MS-3 deployment completed successfully."
```

